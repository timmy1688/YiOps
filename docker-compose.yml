x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yiops}
      MYSQL_USER: ${MYSQL_USER:-yiops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yiops_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yiops_local_root_password}
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

  yiops:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${YIOPS_IMAGE:-yiops:local}
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      YIOPS_ENVIRONMENT: production
      YIOPS_DATABASE_URL: mysql://${MYSQL_USER:-yiops}:${MYSQL_PASSWORD:-yiops_local_password}@mysql:3306/${MYSQL_DATABASE:-yiops}?charset=utf8mb4
      YIOPS_AUTO_CREATE_TABLES: "false"
      YIOPS_DATASOURCE_MOCK_MODE: ${YIOPS_DATASOURCE_MOCK_MODE:-false}
      YIOPS_LLM_MOCK_MODE: ${YIOPS_LLM_MOCK_MODE:-true}
      YIOPS_ANALYSIS_CONCURRENCY: ${YIOPS_ANALYSIS_CONCURRENCY:-2}
      YIOPS_ANALYSIS_TIMEOUT_SECONDS: ${YIOPS_ANALYSIS_TIMEOUT_SECONDS:-300}
      YIOPS_DATASOURCE_TIMEOUT_SECONDS: ${YIOPS_DATASOURCE_TIMEOUT_SECONDS:-15}
      YIOPS_AUTH_ENABLED: ${YIOPS_AUTH_ENABLED:-false}
      YIOPS_ADMIN_USERNAME: ${YIOPS_ADMIN_USERNAME:-admin}
      YIOPS_ADMIN_PASSWORD: ${YIOPS_ADMIN_PASSWORD:-}
      YIOPS_SESSION_TTL_HOURS: ${YIOPS_SESSION_TTL_HOURS:-168}
      YIOPS_AUTH_COOKIE_SECURE: ${YIOPS_AUTH_COOKIE_SECURE:-false}
      TZ: ${TZ:-UTC}
    ports:
      - "${YIOPS_BIND_ADDRESS:-127.0.0.1}:${YIOPS_PORT:-8100}:8100"
    volumes:
      - runtime_data:/app/.runtime
      - logs_data:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

volumes:
  mysql_data:
  runtime_data:
  logs_data:

networks:
  backend:
    internal: false
