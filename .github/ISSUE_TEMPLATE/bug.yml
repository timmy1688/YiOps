name: Bug report
description: 报告可复现的 YiOps 问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YiOps 版本
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options: [Docker Compose, Source, Kubernetes, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
