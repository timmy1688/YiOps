apiVersion: v1
kind: ServiceAccount
metadata:
  name: yiops-reader
  namespace: yiops-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yiops-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yiops-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yiops-reader
subjects:
  - kind: ServiceAccount
    name: yiops-reader
    namespace: yiops-observability
---
apiVersion: v1
kind: Secret
metadata:
  name: yiops-reader-token
  namespace: yiops-observability
  annotations:
    kubernetes.io/service-account.name: yiops-reader
type: kubernetes.io/service-account-token
